[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mgm"
version = "0.1.0"
description = "Mi Gemini CLI — agente de IA de terminal en español, vía g4f con cookie de sesión"
requires-python = ">=3.11"
dependencies = [
    "g4f",
    "rich",
    "prompt_toolkit",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
]

[project.scripts]
mgm = "mgm.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"mgm.skills.builtin" = ["*.md"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]
